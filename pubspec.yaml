name: lovera
description: Çiftler için özel, samimi ve premium mobil uygulama.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^17.2.1
  haptic_feedback: ^0.5.1
  qr_flutter: ^4.1.0
  chess: ^0.8.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  battery_plus: ^7.1.2
  http: ^1.6.0
  firebase_messaging: ^15.2.10
  flutter_background_service: ^5.1.0
  dart_jsonwebtoken: ^2.14.0
  gal: ^2.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.3
  home_widget: ^0.10.0
  exif: ^3.3.0
  sign_in_with_apple: ^8.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
