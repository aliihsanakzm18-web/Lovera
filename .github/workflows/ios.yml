name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA with Widgets
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application & Widget Extension (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Verify Embedded Widget Extension
        run: |
          WIDGET_APPEX="build/ios/iphoneos/Runner.app/PlugIns/LoveraWidgets.appex"
          if [ ! -d "$WIDGET_APPEX" ]; then
            echo "ERROR: LoveraWidgets.appex was not embedded in Runner.app/PlugIns!"
            exit 1
          fi
          echo "=== Verified LoveraWidgets.appex in PlugIns ==="
          ls -la "$WIDGET_APPEX"
          plutil -p "$WIDGET_APPEX/Info.plist"
          file "$WIDGET_APPEX/LoveraWidgets"
          otool -hv "$WIDGET_APPEX/LoveraWidgets"

      - name: Package Payload as IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Lovera.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lovera-iOS
          path: build/ios/iphoneos/Lovera.ipa
          retention-days: 14
